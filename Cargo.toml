[package]
name = "host-env-vault"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike of the host profile vault for Denarius and the Amtgard IDP"

[dependencies]
age = "0.12.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.190"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
aws-config = { version = "1.5.10", features = ["behavior-version-latest"] }
aws-sdk-ssm = "1.61.0"
tokio = { version = "1.41", features = ["rt-multi-thread"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
